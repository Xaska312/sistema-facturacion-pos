<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>XASKA POS · Punto de venta e inventario para negocios en Colombia</title>
  <base href="/">
  <!-- Sin acercar ni alejar (decisión 283): la app ya se adapta a cada pantalla; el zoom del celular (pellizco o el
       automático al tocar un campo) la dejaba corrida. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="XASKA POS: punto de venta, inventario, fiados, caja y factura electrónica para tiendas, droguerías, restaurantes y negocios pequeños en Colombia. Funciona en computador, tablet y celular, también sin internet.">
  <meta name="application-name" content="XASKA POS">
  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook) y datos para buscadores (decisión 345). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="XASKA">
  <meta property="og:locale" content="es_CO">
  <meta property="og:title" content="XASKA POS · Punto de venta para negocios en Colombia">
  <meta property="og:description" content="Vende, controla tu inventario, fía y cierra caja desde el computador o el celular.">
  <meta property="og:url" content="https://app.xaska.co/precios">
  <meta property="og:image" content="https://app.xaska.co/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#111827">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Modo oscuro antes del primer render. Archivo aparte por la CSP (sin scripts en línea). -->
  <script src="theme-init.js"></script>
</head>

  <app-root></app-root>
</body>
</html>
