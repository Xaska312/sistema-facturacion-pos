name: Imágenes de producción

# Construye y publica en GitHub Container Registry (ghcr.io) las imágenes que usa el servidor:
#   pos-hibrido-backend, pos-hibrido-web (Angular + Caddy) y pos-hibrido-backup.
# - En main: solo después de que el CI termina en verde. Etiquetas "latest" y "sha-<commit>".
# - Con una etiqueta de versión (git tag v0.7.0): etiqueta "0.7.0" (recomendada en producción).
# - Manual: pestaña Actions → "Imágenes de producción" → Run workflow.
# Para AMD (Hetzner CX) y ARM (Hetzner CAX).

on:
  workflow_run:
    workflows: ["CI POS Híbrido"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Imagen ${{ matrix.name }}
    # workflow_run: solo CI en verde de un push a main. Un PR desde la rama "main" de un fork también trae
    # head_branch == 'main'; sin el filtro de evento, su código podría publicarse como "latest".
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./frontend
          - name: backup
            context: ./deploy/backup
    steps:
      - uses: actions/checkout@v4
        with:
          # En workflow_run, el commit que pasó el CI (no el último de main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Commit corto
        id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pos-hibrido-${{ matrix.name }}
          # "latest" solo con la regla de abajo (main). Sin esto, cada etiqueta v* también movería "latest".
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
