name: E2E POS Híbrido

# Flujo de punta a punta (registro y confirmación del correo → login → abrir caja → vender → cerrar caja) con la
# app levantada por docker compose (incluye Mailpit). Corre en cada PR hacia main y también a mano desde Actions.
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Variables de entorno de prueba
        run: |
          {
            echo "DB_NAME=pos_hibrido"
            echo "DB_USER=pos_e2e"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_URL=jdbc:postgresql://postgres-db:5432/pos_hibrido"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:4200"
            echo "REFRESH_COOKIE_SECURE=false"
            echo "OPENAPI_ENABLED=false"
          } > .env

      - name: Levantar la aplicación
        run: docker compose up -d --build

      - name: Esperar backend, frontend y buzón de prueba
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null && curl -fsS http://localhost:4200 > /dev/null \
              && curl -fsS http://localhost:8025/api/v1/info > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        working-directory: ./e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Ejecutar E2E
        working-directory: ./e2e
        run: npx playwright test

      - name: Logs de la aplicación
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Reporte
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
