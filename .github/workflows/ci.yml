name: CI POS Híbrido

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Un push nuevo al mismo PR cancela la ejecución anterior (ahorra minutos de Actions).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Java 21 · compilación + tests con Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build y tests (unitarios + integración)
        run: mvn -B clean verify

  frontend:
    name: Frontend (Node 22 · build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (ESLint + angular-eslint)
        run: npm run lint
      - name: Sin colores literales en templates (modo oscuro)
        run: npm run check:colors
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test:ci
