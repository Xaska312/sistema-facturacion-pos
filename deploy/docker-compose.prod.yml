# Producción en un solo servidor (Hetzner CX23/CAX11: 2 vCPU, 4 GB).
# Guía completa: docs/DESPLIEGUE.md. En el servidor:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Solo Caddy publica puertos (80/443). PostgreSQL y el backend quedan en redes internas de Docker,
# sin acceso desde internet (Docker se salta el firewall ufw con los puertos publicados).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: pos-hibrido

services:
  postgres-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Superusuario solo para administrar y respaldar. La app usa DB_USER, sin privilegios de superusuario.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Define POSTGRES_ADMIN_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-pos_hibrido}
      APP_DB_USER: ${DB_USER:?Define DB_USER en .env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: UTC
    # Ajustado para ~1 GB de memoria del contenedor.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea el usuario de la app la primera vez (base vacía). No se vuelve a ejecutar después.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    mem_limit: 1g
    healthcheck:
      # Por TCP: durante la primera inicialización PostgreSQL solo escucha por socket, y el backend no debe arrancar aún.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    image: ghcr.io/${GHCR_OWNER:?Define GHCR_OWNER en .env}/pos-hibrido-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:-pos_hibrido}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      # Mismo dominio que la app (no hay CORS real). Se puede cambiar solo para probar en local (ver .env.example).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:?Define DOMAIN en .env}}
      REFRESH_COOKIE_SECURE: "true"
      OPENAPI_ENABLED: "false"
      # La IP real del cliente viene de Caddy (X-Forwarded-For): límites de intentos y auditoría por IP real.
      FORWARD_HEADERS_STRATEGY: native
    depends_on:
      postgres-db:
        condition: service_healthy
    networks: [data, web]
    mem_limit: 1280m
    # El backend termina las peticiones en curso hasta 20 s (server.shutdown=graceful); Docker espera 30 s.
    stop_grace_period: 30s
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER}/pos-hibrido-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      # CADDY_SITE permite probar en local sin certificado (http://localhost); en el servidor queda DOMAIN.
      DOMAIN: ${CADDY_SITE:-${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificados de Let's Encrypt: si se pierden, Caddy los vuelve a pedir (con límite semanal).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    networks: [web]
    mem_limit: 256m
    logging: *logging

  backup:
    image: ghcr.io/${GHCR_OWNER}/pos-hibrido-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    # crond no atiende señales como proceso 1: con init se detiene al instante en vez de esperar 10 s.
    init: true
    environment:
      PGHOST: postgres-db
      PGUSER: ${POSTGRES_ADMIN_USER}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PGDATABASE: ${DB_NAME:-pos_hibrido}
      APP_DB_USER: ${DB_USER}
      TZ: ${TZ:-America/Bogota}
      BACKUP_CRON: ${BACKUP_CRON:-30 3 * * *}
      RESTORE_TEST_CRON: ${RESTORE_TEST_CRON:-0 5 * * 0}
      BACKUP_KEEP_LOCAL: ${BACKUP_KEEP_LOCAL:-7}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-30}
      BACKUP_KEEP_MONTHLY_DAYS: ${BACKUP_KEEP_MONTHLY_DAYS:-400}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESTORE_TEST_PING_URL: ${RESTORE_TEST_PING_URL:-}
    volumes:
      - backups:/backups
      # rclone.conf con el acceso a Google Drive y la clave de cifrado (ver docs/DESPLIEGUE.md).
      - ./rclone:/config/rclone
    depends_on:
      postgres-db:
        condition: service_healthy
    networks: [data]
    mem_limit: 512m
    logging: *logging

networks:
  # data: base de datos, backend y respaldos (los respaldos necesitan salir a internet para subir a Drive).
  # web: Caddy y backend. Caddy no ve la base de datos.
  data:
  web:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  backups:
