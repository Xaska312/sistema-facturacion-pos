# Para construir las imágenes en tu equipo en vez de descargarlas de GitHub (pruebas locales del modo producción):
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
# En el servidor no se usa: allí las imágenes vienen ya construidas desde GitHub Actions.
services:
  backend:
    build:
      context: ../backend
  web:
    build:
      context: ../frontend
  backup:
    build:
      context: ./backup
