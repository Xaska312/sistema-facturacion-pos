server:
  port: ${SERVER_PORT:8080}
  # Detrás de Caddy (producción) usar "native": la IP real y el https salen de X-Forwarded-For/-Proto,
  # que Tomcat solo acepta si la petición viene de una red privada (la red interna de Docker).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Al detener el contenedor, termina las peticiones en curso (una venta a medio guardar) antes de salir.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: poshibrido-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_hibrido}
    username: ${DB_USER:pos_user}
    password: ${DB_PASSWORD:}
    hikari:
      # 20 desde la decisión 277: con 10, la carga 5x de 150 negocios dejaba esperas largas por una conexión libre.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Espera máxima por una conexión libre: con el pool lleno se responde 503 "intenta de nuevo" (QA INV-6).
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      # Ninguna espera por un bloqueo pasa de 10 s (una sesión que retiene filas no congela las ventas) y una
      # transacción abandonada sin cerrar se corta al minuto.
      connection-init-sql: SET lock_timeout = '10s'; SET idle_in_transaction_session_timeout = '60s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Carga las colecciones perezosas (presentaciones, códigos de barras…) de a 100 en una consulta: evita el
        # N+1 de los listados de productos y existencias (QA INV-5).
        default_batch_fetch_size: 100
  threads:
    virtual:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  security:
    # Secreto HS256 (mínimo 32 bytes). Obligatorio: sin valor por defecto.
    jwt-secret: ${JWT_SECRET}
    issuer: pos-hibrido
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    max-failed-attempts: 5
    lock-duration: PT15M
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN:10}
    register-per-minute: ${RATE_LIMIT_REGISTER:5}
    # Toda la API, por usuario (o por IP sin sesión). "heavy": exportar CSV, importar productos y cerrar un negocio.
    api-per-minute: ${RATE_LIMIT_API:300}
    heavy-per-minute: ${RATE_LIMIT_HEAVY:20}
    # Conexiones a los avisos en vivo (/dining/events), por usuario. Aparte del general: si se pasa, solo se cortan
    # los avisos (las pantallas siguen consultando) y nunca el resto de la app (decisión 291).
    events-per-minute: ${RATE_LIMIT_EVENTS:30}
  platform:
    # Correos de los administradores de plataforma, separados por coma (consola /plataforma).
    admin-emails: ${PLATFORM_ADMIN_EMAILS:}
  ai:
    # Lectura de facturas con IA (decisión 295). Sin clave, la lectura está apagada (el XML sigue funcionando).
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    invoice-model: ${AI_INVOICE_MODEL:claude-haiku-5-5}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
  mail:
    # Remitente. Sin dominio propio, Resend solo permite onboarding@resend.dev y enviar a tu propio correo.
    from: ${MAIL_FROM:XASKA POS <onboarding@resend.dev>}
    # Con clave, los correos salen por Resend. Sin clave: SMTP si hay spring.mail.host (Mailpit), si no, al log.
    resend-api-key: ${RESEND_API_KEY:}
    # Dirección pública de la app, para los enlaces de los correos.
    public-url: ${APP_PUBLIC_URL:http://localhost:4200}
    async: true
  auth:
    # Exigir correo confirmado para crear un negocio.
    require-email-verification: ${EMAIL_VERIFICATION_REQUIRED:true}
  subscription:
    # Prueba gratis del primer negocio de cada cuenta (días y plan cuyos límites aplica).
    trial-days: ${SUBSCRIPTION_TRIAL_DAYS:14}
    trial-plan: EMPRESA
    # Prueba gratis sin código para el primer negocio de cada cuenta. Por defecto no: todo negocio nuevo necesita un
    # código de activación (la prueba se da con un código de 1 mes desde la consola de plataforma).
    trial-without-code: ${SUBSCRIPTION_TRIAL_WITHOUT_CODE:true}
    # Días que un plan pagado vencido sigue funcionando antes de quedar en solo consulta.
    grace-days: 3
    # Cómo pagar: cuenta, Nequi y a quién enviar el comprobante. Sale en la app y en los correos de aviso.
    payment-instructions: ${SUBSCRIPTION_PAYMENT_INSTRUCTIONS:Comunícate con soporte para renovar.}
    # Correos diarios de aviso (9 a. m. de Colombia).
    reminders-enabled: ${SUBSCRIPTION_REMINDERS_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

management:
  health:
    # El buzón de pruebas (Mailpit) caído no debe marcar el backend como caído.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [req=%X{requestId:-} tenant=%X{tenant:-} user=%X{userId:-}]"
