services:
  postgres-db:
    image: postgres:16-alpine
    container_name: poshibrido-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-pos_hibrido}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poshibrido-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres-db:5432/pos_hibrido}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Correos: sin RESEND_API_KEY van al buzón de prueba (Mailpit, http://localhost:8025); con la clave, por Resend.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-POS Híbrido <onboarding@resend.dev>}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
    depends_on:
      postgres-db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Buzón de prueba: atrapa todos los correos del backend (nada sale a internet). Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: poshibrido-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: poshibrido-frontend
    ports:
      - "4200:4200"
    environment:
      API_TARGET: http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres-data:
